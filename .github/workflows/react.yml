name: React CI

on:
  push:
    branches: [ "wk06" ]
    paths:
      - "frontend/**"

  pull_request:
    branches: [ "wk06" ]
    paths:
      - "frontend/**"

# trigger ci
jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: false

      - name: Lint
        run: npm run lint